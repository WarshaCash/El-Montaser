<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241206">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المنتصر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>المنتصر</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<aside id="sidebar" aria-label="القائمة الرئيسية">
  <div class="brand"><img class="brand-logo" src="assets/logo.webp" alt="" onerror="this.style.display='none'"><div class="brand-txt"><span class="brand-name">المنتصر</span><div class="brand-sub"><i></i><span>لتصنيع الموبيليا الحديثة والباب والشباك</span><i></i></div></div></div>
  <nav id="nav"></nav>
</aside>
<div id="shade"></div>
<main>
  <header class="topbar">
    <button id="toggle" aria-label="فتح/طي القائمة" title="فتح/طي القائمة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <h1 id="title"></h1>
    <button id="gsearch" class="search-btn" type="button" title="بحث سريع (Ctrl+K أو /)"><svg class="ic" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 110-15 7.5 7.5 0 010 15z"/></svg><span>ابحث عن عميل…</span><kbd>Ctrl K</kbd></button>
    <div class="top-actions">
      <button id="qcollect" class="btn sm" type="button" title="تحصيل دفعة (F2)">تحصيل دفعة</button>
      <a id="qnew" class="btn sm" href="#/invoices/new" title="فاتورة جديدة (Alt+N)">فاتورة جديدة</a>
    </div>
  </header>
  <section id="view" tabindex="-1"></section>
</main>
<script src="js/boot/file-protocol-guard.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
